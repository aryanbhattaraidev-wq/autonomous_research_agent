[project]
name = "autonomous-research-agent"
version = "0.1.0"
description = "LangGraph-powered autonomous research agent: plan, search, summarize, take notes, and answer follow-ups."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.111.0",
    "fastembed>=0.3.0",
    "httpx>=0.27.0",
    "langchain-core>=0.2.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=0.1.0",
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.9.0",
    "requests>=2.31.0",
    "streamlit>=1.35.0",
    "tavily-python>=0.3.0",
    "uvicorn>=0.29.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
